name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Provide stub values so typecheck/lint/build pass in CI without real secrets
  NEXT_PUBLIC_SANITY_PROJECT_ID: "stub-project-id"
  NEXT_PUBLIC_SANITY_DATASET: "production"
  NEXT_PUBLIC_SANITY_API_VERSION: "2024-10-01"
  NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  # Server-only keys — not exposed to browser, but needed for build
  SANITY_API_READ_TOKEN: "stub-token"
  SANITY_WEBHOOK_SECRET: "stub-secret"
  SUPABASE_SERVICE_ROLE_KEY: "stub-service-key"

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
